name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For creating GitHub releases
      id-token: write  # For npm provenance via OIDC

    steps:
      - name: Validate tag format and version match
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid tag format: $TAG (expected: X.Y.Z)"
            exit 1
          fi
          echo "VERSION=$TAG" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PKG_VERSION" != "${{ env.VERSION }}" ]]; then
            echo "❌ Version mismatch!"
            echo "   Tag version:         ${{ env.VERSION }}"
            echo "   package.json version: $PKG_VERSION"
            echo ""
            echo "Fix: Update package.json before tagging:"
            echo "  npm version ${{ env.VERSION }} --no-git-tag-version"
            echo "  git add package.json"
            echo "  git commit -m 'chore: bump version to ${{ env.VERSION }}'"
            exit 1
          fi
          echo "✅ Version match: $PKG_VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm test

      - name: Rebuild and verify MCPB bundle
        if: hashFiles('manifest.json') != ''
        env:
          EXPECTED_VERSION: ${{ env.VERSION }}
        run: |
          npx mcpb pack . replicant-mcp.mcpb
          BUNDLE_VERSION=$(unzip -p replicant-mcp.mcpb package.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).version))")
          if [[ "$BUNDLE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "❌ MCPB bundle version mismatch: bundle=$BUNDLE_VERSION, expected=$EXPECTED_VERSION"
            exit 1
          fi
          echo "✅ MCPB bundle verified at v$EXPECTED_VERSION"

      # MCP Registry pre-flight: install + validate + auth before any irreversible publish.
      # Failures here abort the release before npm publish, preserving "as-atomic-as-feasible" semantics.
      - name: Install mcp-publisher (pinned)
        env:
          # Bump deliberately. See https://github.com/modelcontextprotocol/registry/releases
          MCP_PUBLISHER_VERSION: 1.7.8
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Validate MCP Registry manifest
        run: ./mcp-publisher validate .mcp/server.json

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish .mcp/server.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: replicant-mcp.mcpb
