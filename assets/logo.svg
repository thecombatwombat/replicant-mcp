<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0faf4"/>
      <stop offset="100%" stop-color="#e8f5ed"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4cda8b"/>
      <stop offset="100%" stop-color="#3ddc84"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle shadow -->
  <ellipse cx="256" cy="408" rx="88" ry="8" fill="#3ddc84" opacity="0.08"/>

  <!--
    PRONG ANTENNAE — plug contacts on top
  -->
  <rect x="194" y="48" width="12" height="72" rx="6" fill="#3ddc84"/>
  <rect x="306" y="48" width="12" height="72" rx="6" fill="#3ddc84"/>

  <!--
    HEAD — the connector housing.

    The body is one continuous shape: dome flows into the housing,
    which tapers into integrated contact feet at the base.
    No seam between face and contacts — they're one piece.
  -->
  <path d="
    M 144 210
    Q 144 104 256 104
    Q 368 104 368 210
    L 368 340
    Q 368 356 352 356
    L 296 356
    L 296 392
    Q 296 400 288 400
    L 268 400
    Q 260 400 260 392
    L 260 356
    L 252 356
    L 252 392
    Q 252 400 244 400
    L 224 400
    Q 216 400 216 392
    L 216 356
    L 160 356
    Q 144 356 144 340
    Z
  " fill="url(#green)"/>

  <!--
    EYES — big, friendly, curious
  -->
  <ellipse cx="212" cy="236" rx="30" ry="32" fill="#fff"/>
  <ellipse cx="300" cy="236" rx="30" ry="32" fill="#fff"/>

  <circle cx="218" cy="229" r="15" fill="#2d3436"/>
  <circle cx="306" cy="229" r="15" fill="#2d3436"/>

  <!-- Shine -->
  <circle cx="224" cy="223" r="5.5" fill="#fff"/>
  <circle cx="312" cy="223" r="5.5" fill="#fff"/>
  <circle cx="214" cy="235" r="2.5" fill="#fff" opacity="0.5"/>
  <circle cx="302" cy="235" r="2.5" fill="#fff" opacity="0.5"/>

  <!-- Smile -->
  <path d="M 228 292 Q 256 320 284 292" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!--
    SIGNAL ARCS — both antennae broadcasting
  -->
  <!-- Right antenna -->
  <path d="M 324 72 Q 334 64 334 52" fill="none" stroke="#3ddc84" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 332 78 Q 346 66 346 48" fill="none" stroke="#3ddc84" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M 338 86 Q 358 68 358 44" fill="none" stroke="#3ddc84" stroke-width="2.5" stroke-linecap="round" opacity="0.18"/>

  <!-- Left antenna -->
  <path d="M 188 72 Q 178 64 178 52" fill="none" stroke="#3ddc84" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 180 78 Q 166 66 166 48" fill="none" stroke="#3ddc84" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M 174 86 Q 154 68 154 44" fill="none" stroke="#3ddc84" stroke-width="2.5" stroke-linecap="round" opacity="0.18"/>

</svg>
