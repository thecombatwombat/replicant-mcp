    z-index: 10;

  .hud-title {

  .hud-stat-label {

  }

  .filter-btn {

    border-color: rgba(74, 158, 255, 0.4);
  }

  .filter-btn.active {

    border-color: rgba(74, 158, 255, 0.6);
    box-shadow: 0 0 12px rgba(74, 158, 255, 0.2);
  }

  #detail-panel {
    position: fixed;
    right: -420px;
    top: 0;
    width: 400px;
    height: 100vh;
    background: rgba(3, 8, 16, 0.92);
    border-left: 1px solid rgba(74, 158, 255, 0.2);
    backdrop-filter: blur(20px);

  #detail-panel::-webkit-scrollbar { width: 4px; }

  #detail-panel::-webkit-scrollbar-thumb { background: rgba(74,158,255,0.3); border-radius: 2px; }

  .detail-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: 1px solid rgba(74, 158, 255, 0.2);
    color: #6a9abf;
    width: 28px;
    height: 28px;
    border-radius: 4px;

    display: flex;
    align-items: center;
    justify-content: center;

  }

  .detail-badge {

    letter-spacing: 1px;
    text-transform: uppercase;

  .badge-p2 { background: rgba(255, 180, 40, 0.15); color: #ffb428; border: 1px solid rgba(255, 180, 40, 0.3); }
  .badge-p3 { background: rgba(74, 158, 255, 0.15); color: #4a9eff; border: 1px solid rgba(74, 158, 255, 0.3); }

  .badge-bug { background: rgba(255, 60, 60, 0.15); color: #ff6060; border: 1px solid rgba(255, 60, 60, 0.3); }
  .badge-feature { background: rgba(60, 200, 120, 0.15); color: #3cc878; border: 1px solid rgba(60, 200, 120, 0.3); }
  .badge-task { background: rgba(74, 158, 255, 0.15); color: #4a9eff; border: 1px solid rgba(74, 158, 255, 0.3); }

    white-space: pre-wrap;

  .detail-description code {
    background: rgba(74, 158, 255, 0.1);

  .detail-section-label {

    text-transform: uppercase;

  .detail-children li {

  /* Legend */
  #legend {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 10;
    font-size: 10px;

  #loading {

    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;

  .loading-ring {
    width: 60px; height: 60px;
    border: 2px solid rgba(74, 158, 255, 0.1);
    border-top: 2px solid #4a9eff;
    border-radius: 50%;

    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 11px;
    letter-spacing: 3px;
    color: #4a6a8a;
    text-transform: uppercase;
  }
</style>

  { id: "wf4", title: "Screenshot Test Coverage", type: "epic", priority: "p3", epic: null,

  // ── Workflow Automation (od3) ──
  { id: "3v5", title: "Add /pr-with-review as mandatory PR workflow in CLAUDE.md", type: "task", priority: "p1", epic: "od3",

  { id: "qik", title: "Add opt-in OCR enrichment for visual analysis", type: "feature", priority: "p2", epic: "0y8",

const prioritySizes = { p1: 12, p2: 7, p3: 4 };

function buildGraphData(filter = 'all') {
  let filtered = issues;

  if (filter === 'p1' || filter === 'p2' || filter === 'p3') {
    // Show matching priority + their parent epics
    const matching = issues.filter(i => i.priority === filter);
    const epicIds = new Set(matching.filter(i => i.epic).map(i => i.epic));
    filtered = issues.filter(i => i.priority === filter || (i.type === 'epic' && epicIds.has(i.id)));
  } else if (filter === 'bug' || filter === 'feature' || filter === 'task') {
    const matching = issues.filter(i => i.type === filter);
    const epicIds = new Set(matching.filter(i => i.epic).map(i => i.epic));
    filtered = issues.filter(i => i.type === filter || (i.type === 'epic' && epicIds.has(i.id)));
  } else if (filter === 'epic') {
    filtered = issues.filter(i => i.type === 'epic');
  }

  const filteredIds = new Set(filtered.map(i => i.id));

  const nodes = filtered.map(issue => ({
    id: issue.id,
    name: issue.title,
    type: issue.type,
    priority: issue.priority,
    epic: issue.epic,
    desc: issue.desc,
    val: prioritySizes[issue.priority] || 5,
    color: typeColors[issue.type] || '#4a9eff',
  }));

  const links = [];
  filtered.forEach(issue => {
    if (issue.epic && filteredIds.has(issue.epic)) {
      links.push({
        source: issue.epic,
        target: issue.id,
        color: 'rgba(74, 158, 255, 0.12)',
      });
    }
  });

  return { nodes, links };
}

// ─── Rendering ────────────────────────────────────────────────────────────────

let graph;
let selectedNode = null;

function initGraph() {
  const container = document.getElementById('graph-container');
  const data = buildGraphData();

  graph = ForceGraph3D()(container)
    .graphData(data)
    .backgroundColor('#030810')
    .showNavInfo(false)
    .nodeVal(n => n.val)
    .nodeColor(n => n.color)
    .nodeOpacity(0.92)
    .nodeResolution(20)
    .linkWidth(0.4)
    .linkOpacity(0.15)
    .linkColor(l => l.color)
    .linkDirectionalParticles(1)
    .linkDirectionalParticleWidth(0.6)
    .linkDirectionalParticleSpeed(0.004)
    .linkDirectionalParticleColor(() => 'rgba(74, 158, 255, 0.4)')
    .d3AlphaDecay(0.03)
    .d3VelocityDecay(0.3)
    .warmupTicks(80)
    .onNodeClick(handleNodeClick)
    .onNodeHover(handleNodeHover)
    .nodeThreeObject(node => {
      const group = new THREE.Group();

      // Glow sphere
      const glowGeo = new THREE.SphereGeometry(node.val * 0.6, 20, 20);
      const glowMat = new THREE.MeshBasicMaterial({
        color: node.color,
        transparent: true,
        opacity: 0.12,
      });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.scale.set(2.5, 2.5, 2.5);
      group.add(glow);

      // Core sphere
      const coreGeo = new THREE.SphereGeometry(node.val * 0.5, 20, 20);
      const coreMat = new THREE.MeshPhongMaterial({
        color: node.color,
        emissive: node.color,
        emissiveIntensity: 0.4,
        transparent: true,
        opacity: 0.9,
        shininess: 100,
      });
      const core = new THREE.Mesh(coreGeo, coreMat);
      group.add(core);

      // Ring for epics
      if (node.type === 'epic') {
        const ringGeo = new THREE.RingGeometry(node.val * 0.8, node.val * 0.95, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: node.color,
          transparent: true,
          opacity: 0.3,
          side: THREE.DoubleSide,
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        group.add(ring);
      }

      // Label
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const label = node.type === 'epic' ? node.name : node.id;
      canvas.width = 256;
      canvas.height = 48;
      ctx.font = node.type === 'epic' ? 'bold 22px JetBrains Mono, monospace' : '18px JetBrains Mono, monospace';
      ctx.fillStyle = node.color;
      ctx.globalAlpha = node.type === 'epic' ? 0.9 : 0.7;
      ctx.textAlign = 'center';
      ctx.fillText(label, 128, 30);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(24, 5, 1);
      sprite.position.y = node.val * 0.7 + 4;
      group.add(sprite);

      return group;
    });

  // Camera position
  graph.cameraPosition({ x: 0, y: 0, z: 250 });

  // Remove loading
  setTimeout(() => {
    document.getElementById('loading').style.display = 'none';
  }, 1500);
}

function handleNodeClick(node) {
  if (!node) return;

  selectedNode = node;
  const issue = issues.find(i => i.id === node.id);
  if (!issue) return;

  // Fly to node
  const distance = 80;
  const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
  graph.cameraPosition(
    { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
    node,
    1200
  );

  // Build detail panel
  const children = issues.filter(i => i.epic === issue.id);
  const parentEpic = issue.epic ? issues.find(i => i.id === issue.epic) : null;

  let html = `
    <div class="detail-id">replicant-mcp-${issue.id}</div>
    <div class="detail-title">${issue.title}</div>
    <div class="detail-meta">
      <span class="detail-badge badge-${issue.priority}">${issue.priority.toUpperCase()}</span>
      <span class="detail-badge badge-${issue.type}">${issue.type}</span>
    </div>
  `;

  if (parentEpic) {
    html += `
      <div class="detail-section-label">Epic</div>
      <ul class="detail-children">
        <li onclick="navigateToNode('${parentEpic.id}')">${parentEpic.title}</li>
      </ul>
    `;
  }

  html += `<div class="detail-section-label">Description</div>
    <div class="detail-description">${escapeHtml(issue.desc)}</div>`;

  if (children.length > 0) {
    html += `<div class="detail-section-label">Children (${children.length})</div><ul class="detail-children">`;
    children.forEach(c => {
      const dot = `<span style="color:${typeColors[c.type]}">●</span>`;
      html += `<li onclick="navigateToNode('${c.id}')">${dot} ${c.id} — ${c.title}</li>`;
    });
    html += '</ul>';
  }

  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail-panel').classList.add('open');
}

function handleNodeHover(node) {
  document.body.style.cursor = node ? 'pointer' : 'default';
}

function navigateToNode(id) {
  const gd = graph.graphData();
  const node = gd.nodes.find(n => n.id === id);
  if (node) handleNodeClick(node);
}

function closePanel() {
  document.getElementById('detail-panel').classList.remove('open');
  selectedNode = null;
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

// ─── Filters ──────────────────────────────────────────────────────────────────

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filter = btn.dataset.filter;
    const data = buildGraphData(filter);
    graph.graphData(data);
    closePanel();
  });
});

// ─── Keyboard ─────────────────────────────────────────────────────────────────

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePanel();
});

// ─── Init ─────────────────────────────────────────────────────────────────────

window.addEventListener('load', initGraph);
window.addEventListener('resize', () => {
  if (graph) graph.width(window.innerWidth).height(window.innerHeight);
});

</script>
</body>
</html>
